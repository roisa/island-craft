name: Publish game to GitHub Pages

# Tests, builds and publishes the game to the `gh-pages` branch.
# The game is only published when the unit tests and the browser smoke test
# pass, so a broken build never replaces the live game.
# In the repository settings, set Pages → Source to "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`. The game is then served at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (desktop, phone, tablet profiles)
        run: npm run smoke
        timeout-minutes: 20
      - name: Push the build to gh-pages
        run: |
          cp -r appstore dist/appstore   # App Store kit: website only, not in the iOS app
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
